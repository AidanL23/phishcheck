name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.75.0
      - name: Lint proto
        run: buf lint
      - name: Generated code is current
        run: |
          buf generate
          git status --porcelain gen/
          test -z "$(git status --porcelain gen/)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
